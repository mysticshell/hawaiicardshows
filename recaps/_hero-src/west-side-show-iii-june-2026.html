<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>West Side Card Show III — branded hero (fallback until real photos)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Phudu:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 840px; overflow: hidden; }
  body {
    background: #1a1a1a;
    color: #ffffff;
    font-family: 'Archivo', sans-serif;
    position: relative;
    padding: 96px 110px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  /* lava glow (West Side energy) top-right + teal glow (series accent) bottom-left */
  body::before { content:''; position:absolute; top:-260px; right:-200px; width:900px; height:900px; background: radial-gradient(circle, rgba(212,88,42,0.42), transparent 68%); pointer-events:none; }
  body::after  { content:''; position:absolute; bottom:-300px; left:-220px; width:900px; height:900px; background: radial-gradient(circle, rgba(20,180,160,0.20), transparent 70%); pointer-events:none; }
  .inner { position: relative; z-index: 1; }
  .eyebrow {
    font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 26px;
    letter-spacing: 6px; text-transform: uppercase; color: #d4582a; margin-bottom: 26px;
  }
  h1 {
    font-family: 'Phudu', sans-serif; font-weight: 800; font-size: 150px;
    line-height: 0.92; letter-spacing: -4px; color: #ffffff; margin-bottom: 38px;
  }
  .badge {
    display: inline-block; font-family: 'Archivo', sans-serif; font-weight: 800;
    font-size: 30px; letter-spacing: 0.5px; color: #1a1a1a; background: #fff3cf;
    padding: 14px 26px; border-radius: 999px; margin-bottom: 28px;
  }
  .badge .bolt { color: #d4582a; margin-right: 8px; }
  .meta {
    font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 34px;
    color: rgba(255,255,255,0.72);
  }
  .meta strong { color: #ffffff; font-weight: 700; }
  .brand {
    position: absolute; bottom: 64px; left: 110px;
    font-family: 'Phudu', sans-serif; font-weight: 700; font-size: 26px;
    letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.6);
  }
  .chant {
    position: absolute; bottom: 64px; right: 110px;
    font-family: 'Phudu', sans-serif; font-weight: 800; font-size: 28px;
    letter-spacing: 2px; text-transform: uppercase; color: #d4582a;
    transform: rotate(-4deg); border: 3px solid #d4582a; border-radius: 12px; padding: 12px 22px;
  }
</style>
</head>
<body>
  <div class="inner">
    <div class="eyebrow">Show Recap · Hawaii Card Shows</div>
    <h1>West Side<br>Card Show III</h1>
    <div class="badge"><span class="bolt">⚡</span>Max Holloway&rsquo;s Vendor Debut</div>
    <div class="meta"><strong>June 6&ndash;7, 2026</strong> &middot; Kroc Center, Ewa Beach</div>
  </div>
  <div class="brand">Hawaii Card Shows</div>
  <div class="chant">West Side, Best Side</div>
</body>
</html>
