<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Keep It Aloha #3 — branded hero (fallback until real photos)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Phudu:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 840px; overflow: hidden; }
  body {
    background: linear-gradient(135deg, #1c6b5a 0%, #14524a 55%, #0e3b37 100%);
    color: #f5ecd7;
    font-family: 'Archivo', sans-serif;
    position: relative;
    padding: 96px 110px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    overflow: hidden;
  }
  body::before { content:''; position:absolute; top:-260px; left:-160px; width:900px; height:900px; background: radial-gradient(circle, rgba(245,215,163,0.20), transparent 66%); pointer-events:none; }
  body::after  { content:''; position:absolute; bottom:-300px; right:-200px; width:900px; height:900px; background: radial-gradient(circle, rgba(163,196,184,0.22), transparent 70%); pointer-events:none; }
  .inner { position: relative; z-index: 2; }
  .eyebrow {
    font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 26px;
    letter-spacing: 6px; text-transform: uppercase; color: #f5d7a3; margin-bottom: 26px;
  }
  h1 {
    font-family: 'Phudu', sans-serif; font-weight: 800; font-size: 150px;
    line-height: 0.9; letter-spacing: -4px; color: #f8f1de; margin-bottom: 38px;
    text-shadow: 0 0 46px rgba(0,0,0,0.25);
  }
  .badge {
    display: inline-block; font-family: 'Archivo', sans-serif; font-weight: 800;
    font-size: 30px; letter-spacing: 0.5px; color: #14524a; background: #f5d7a3;
    padding: 14px 26px; border-radius: 999px; margin-bottom: 28px;
  }
  .badge .heart { color: #c0603a; margin-right: 8px; }
  .meta {
    font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 34px;
    color: rgba(245,236,215,0.82);
  }
  .meta strong { color: #f8f1de; font-weight: 700; }
  .brand {
    position: absolute; bottom: 64px; left: 110px; z-index: 2;
    font-family: 'Phudu', sans-serif; font-weight: 700; font-size: 26px;
    letter-spacing: 2px; text-transform: uppercase; color: rgba(245,236,215,0.6);
  }
  .chant {
    position: absolute; bottom: 64px; right: 110px; z-index: 2;
    font-family: 'Phudu', sans-serif; font-weight: 800; font-size: 28px;
    letter-spacing: 2px; text-transform: uppercase; color: #f5d7a3;
    transform: rotate(-4deg); border: 3px solid #f5d7a3; border-radius: 12px; padding: 12px 22px;
  }
</style>
</head>
<body>
  <div class="inner">
    <div class="eyebrow">Show Recap · Hawaii Card Shows</div>
    <h1>Keep It Aloha<br>Card Show</h1>
    <div class="badge"><span class="heart">&#10084;</span>Community First &middot; The Keiki Corner</div>
    <div class="meta"><strong>July 4&ndash;5, 2026</strong> &middot; SALT at Our Kaka&rsquo;ako, Honolulu</div>
  </div>
  <div class="brand">Hawaii Card Shows</div>
  <div class="chant">A K&#257;kou Thing</div>
</body>
</html>
