<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Spotlight Card Show — branded hero (fallback until real photos)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Phudu:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 840px; overflow: hidden; }
  body {
    background: #0e0e12;
    color: #ffffff;
    font-family: 'Archivo', sans-serif;
    position: relative;
    padding: 96px 110px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    overflow: hidden;
  }
  /* Stage spotlight: a bright cone of light beaming down from top-center, like an arena spot. */
  .beam {
    position: absolute; top: -240px; left: 50%; transform: translateX(-50%);
    width: 220px; height: 1400px;
    background: linear-gradient(180deg, rgba(255,239,196,0.55) 0%, rgba(255,225,150,0.16) 42%, transparent 78%);
    filter: blur(36px);
    clip-path: polygon(42% 0, 58% 0, 96% 100%, 4% 100%);
    pointer-events: none;
  }
  body::before { content:''; position:absolute; top:-360px; left:50%; transform:translateX(-50%); width:1100px; height:900px; background: radial-gradient(ellipse at top, rgba(255,221,130,0.34), transparent 64%); pointer-events:none; }
  body::after  { content:''; position:absolute; bottom:-320px; right:-220px; width:820px; height:820px; background: radial-gradient(circle, rgba(124,92,255,0.20), transparent 70%); pointer-events:none; }
  .inner { position: relative; z-index: 2; }
  .eyebrow {
    font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 26px;
    letter-spacing: 6px; text-transform: uppercase; color: #ffd470; margin-bottom: 26px;
  }
  h1 {
    font-family: 'Phudu', sans-serif; font-weight: 800; font-size: 168px;
    line-height: 0.9; letter-spacing: -4px; color: #ffffff; margin-bottom: 40px;
    text-shadow: 0 0 60px rgba(255,221,130,0.35);
  }
  .badge {
    display: inline-block; font-family: 'Archivo', sans-serif; font-weight: 800;
    font-size: 30px; letter-spacing: 0.5px; color: #1a1a1a; background: #ffe7a3;
    padding: 14px 26px; border-radius: 999px; margin-bottom: 28px;
  }
  .badge .bolt { color: #b8893a; margin-right: 8px; }
  .meta {
    font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 34px;
    color: rgba(255,255,255,0.74);
  }
  .meta strong { color: #ffffff; font-weight: 700; }
  .brand {
    position: absolute; bottom: 64px; left: 110px; z-index: 2;
    font-family: 'Phudu', sans-serif; font-weight: 700; font-size: 26px;
    letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.6);
  }
  .chant {
    position: absolute; bottom: 64px; right: 110px; z-index: 2;
    font-family: 'Phudu', sans-serif; font-weight: 800; font-size: 28px;
    letter-spacing: 2px; text-transform: uppercase; color: #ffd470;
    transform: rotate(-4deg); border: 3px solid #ffd470; border-radius: 12px; padding: 12px 22px;
  }
</style>
</head>
<body>
  <div class="beam"></div>
  <div class="inner">
    <div class="eyebrow">Show Recap · Hawaii Card Shows</div>
    <h1>Spotlight<br>Card Show</h1>
    <div class="badge"><span class="bolt">★</span>An Arena-Sized Debut</div>
    <div class="meta"><strong>June 20&ndash;21, 2026</strong> &middot; Blaisdell Arena, Honolulu</div>
  </div>
  <div class="brand">Hawaii Card Shows</div>
  <div class="chant">Under the Lights</div>
</body>
</html>
