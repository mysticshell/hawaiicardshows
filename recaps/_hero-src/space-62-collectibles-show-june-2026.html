<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Space 62 Collectibles Show — branded hero (fallback until real photos)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Phudu:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 840px; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 30% 20%, #2b2a6b 0%, #16153a 45%, #0b0a1f 100%);
    color: #ffffff;
    font-family: 'Archivo', sans-serif;
    position: relative;
    padding: 96px 110px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    overflow: hidden;
  }
  /* indigo nebula glows */
  body::before { content:''; position:absolute; top:-280px; right:-180px; width:920px; height:920px; background: radial-gradient(circle, rgba(99,102,241,0.40), transparent 66%); pointer-events:none; }
  body::after  { content:''; position:absolute; bottom:-320px; left:-220px; width:860px; height:860px; background: radial-gradient(circle, rgba(139,92,246,0.22), transparent 70%); pointer-events:none; }
  /* starfield — scattered dots via radial-gradients */
  .stars {
    position:absolute; inset:0; pointer-events:none; opacity:0.9;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 18%, #ffffff, transparent),
      radial-gradient(1.5px 1.5px at 22% 62%, rgba(255,255,255,0.85), transparent),
      radial-gradient(2px 2px at 34% 30%, #ffffff, transparent),
      radial-gradient(1px 1px at 46% 76%, rgba(255,255,255,0.8), transparent),
      radial-gradient(1.5px 1.5px at 58% 14%, #ffffff, transparent),
      radial-gradient(1px 1px at 66% 52%, rgba(255,255,255,0.7), transparent),
      radial-gradient(2px 2px at 74% 82%, #ffffff, transparent),
      radial-gradient(1.5px 1.5px at 82% 26%, #ffffff, transparent),
      radial-gradient(1px 1px at 90% 60%, rgba(255,255,255,0.8), transparent),
      radial-gradient(1.5px 1.5px at 16% 88%, rgba(255,255,255,0.8), transparent),
      radial-gradient(1px 1px at 52% 44%, rgba(255,255,255,0.7), transparent),
      radial-gradient(2px 2px at 94% 90%, #ffffff, transparent);
  }
  .inner { position: relative; z-index: 2; }
  .eyebrow {
    font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 26px;
    letter-spacing: 6px; text-transform: uppercase; color: #a5b4fc; margin-bottom: 26px;
  }
  h1 {
    font-family: 'Phudu', sans-serif; font-weight: 800; font-size: 156px;
    line-height: 0.9; letter-spacing: -4px; color: #ffffff; margin-bottom: 40px;
    text-shadow: 0 0 50px rgba(99,102,241,0.45);
  }
  .badge {
    display: inline-block; font-family: 'Archivo', sans-serif; font-weight: 800;
    font-size: 30px; letter-spacing: 0.5px; color: #1b1a3a; background: #c7d2fe;
    padding: 14px 26px; border-radius: 999px; margin-bottom: 28px;
  }
  .badge .star { color: #6366f1; margin-right: 8px; }
  .meta {
    font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 34px;
    color: rgba(255,255,255,0.78);
  }
  .meta strong { color: #ffffff; font-weight: 700; }
  .brand {
    position: absolute; bottom: 64px; left: 110px; z-index: 2;
    font-family: 'Phudu', sans-serif; font-weight: 700; font-size: 26px;
    letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.6);
  }
  .chant {
    position: absolute; bottom: 64px; right: 110px; z-index: 2;
    font-family: 'Phudu', sans-serif; font-weight: 800; font-size: 28px;
    letter-spacing: 2px; text-transform: uppercase; color: #a5b4fc;
    transform: rotate(-4deg); border: 3px solid #6366f1; border-radius: 12px; padding: 12px 22px;
  }
</style>
</head>
<body>
  <div class="stars"></div>
  <div class="inner">
    <div class="eyebrow">Show Recap · Hawaii Card Shows</div>
    <h1>Space 62<br>Collectibles Show</h1>
    <div class="badge"><span class="star">★</span>Room to Roam at Ala Moana</div>
    <div class="meta"><strong>June 26&ndash;28, 2026</strong> &middot; Ala Moana Center, Honolulu</div>
  </div>
  <div class="brand">Hawaii Card Shows</div>
  <div class="chant">Lived Up to the Name</div>
</body>
</html>
