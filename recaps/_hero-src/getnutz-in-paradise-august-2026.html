<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Get Nutz in Paradise — branded hero (fallback until real photos)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Phudu:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 840px; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 25% 15%, #26210b 0%, #171308 45%, #0c0a06 100%);
    color: #f6f1e4;
    font-family: 'Archivo', sans-serif;
    position: relative;
    padding: 96px 110px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    overflow: hidden;
  }
  body::before { content:''; position:absolute; top:-260px; right:-160px; width:920px; height:920px; background: radial-gradient(circle, rgba(242,201,76,0.34), transparent 66%); pointer-events:none; }
  body::after  { content:''; position:absolute; bottom:-300px; left:-220px; width:860px; height:860px; background: radial-gradient(circle, rgba(207,207,74,0.18), transparent 70%); pointer-events:none; }
  .inner { position: relative; z-index: 2; }
  .eyebrow {
    font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 26px;
    letter-spacing: 6px; text-transform: uppercase; color: #f2c94c; margin-bottom: 26px;
  }
  h1 {
    font-family: 'Phudu', sans-serif; font-weight: 800; font-size: 162px;
    line-height: 0.9; letter-spacing: -4px; color: #ffffff; margin-bottom: 40px;
    text-shadow: 0 0 50px rgba(242,201,76,0.30);
  }
  .badge {
    display: inline-block; font-family: 'Archivo', sans-serif; font-weight: 800;
    font-size: 30px; letter-spacing: 0.5px; color: #171308; background: #f2c94c;
    padding: 14px 26px; border-radius: 999px; margin-bottom: 28px;
  }
  .badge .dot { color: #171308; opacity: 0.55; margin: 0 6px; }
  .meta {
    font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 34px;
    color: rgba(246,241,228,0.78);
  }
  .meta strong { color: #ffffff; font-weight: 700; }
  .brand {
    position: absolute; bottom: 64px; left: 110px; z-index: 2;
    font-family: 'Phudu', sans-serif; font-weight: 700; font-size: 26px;
    letter-spacing: 2px; text-transform: uppercase; color: rgba(246,241,228,0.6);
  }
  .chant {
    position: absolute; bottom: 64px; right: 110px; z-index: 2;
    font-family: 'Phudu', sans-serif; font-weight: 800; font-size: 28px;
    letter-spacing: 2px; text-transform: uppercase; color: #f2c94c;
    transform: rotate(-4deg); border: 3px solid #f2c94c; border-radius: 12px; padding: 12px 22px;
  }
</style>
</head>
<body>
  <div class="inner">
    <div class="eyebrow">Show Recap · Hawaii Card Shows</div>
    <h1>Get Nutz<br>in Paradise</h1>
    <div class="badge">Cards <span class="dot">&bull;</span> Crafts <span class="dot">&bull;</span> Culture</div>
    <div class="meta"><strong>August 9, 2026</strong> &middot; Kroc Center, Ewa Beach</div>
  </div>
  <div class="brand">Hawaii Card Shows</div>
  <div class="chant">Block Party</div>
</body>
</html>
