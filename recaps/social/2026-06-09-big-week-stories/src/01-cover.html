<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Story 1 — Cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Phudu:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    background: #1a1a1a; color: #ffffff; font-family: 'Archivo', sans-serif;
    position: relative; padding: 300px 80px; /* safe zones top/bottom */
    display: flex; flex-direction: column; justify-content: center;
  }
  body::before { content: ''; position: absolute; top: -200px; right: -250px; width: 900px; height: 900px; background: radial-gradient(circle, rgba(212,88,42,0.32), transparent 70%); pointer-events: none; }
  body::after { content: ''; position: absolute; bottom: -200px; left: -250px; width: 900px; height: 900px; background: radial-gradient(circle, rgba(26,107,90,0.22), transparent 70%); pointer-events: none; }
  .inner { position: relative; z-index: 1; }
  .eyebrow { font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 32px; letter-spacing: 7px; color: #d4582a; text-transform: uppercase; margin-bottom: 40px; }
  h1 { font-family: 'Phudu', sans-serif; font-weight: 800; font-size: 150px; line-height: 0.93; letter-spacing: -5px; margin-bottom: 44px; }
  h1 em { font-style: normal; color: #d4582a; }
  .sub { font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 40px; line-height: 1.4; color: rgba(255,255,255,0.72); max-width: 900px; }
  .sub strong { color: #ffffff; font-weight: 800; }
  .pill-row { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 56px; }
  .pill { font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 32px; padding: 18px 32px; border-radius: 999px; border: 3px solid rgba(255,255,255,0.22); color: rgba(255,255,255,0.9); }
  .brand { position: absolute; bottom: 200px; left: 80px; font-family: 'Phudu', sans-serif; font-weight: 700; font-size: 30px; letter-spacing: 2px; color: rgba(255,255,255,0.7); text-transform: uppercase; z-index: 1; }
</style>
</head>
<body>
  <div class="inner">
    <div class="eyebrow">The Week in Review</div>
    <h1>Hawaii&rsquo;s<br><em>biggest week</em><br>of card<br>shows.</h1>
    <p class="sub"><strong>Three shows in one week.</strong></p>
    <div class="pill-row">
      <div class="pill">Bayview · Tue</div>
      <div class="pill">Keep It Aloha · Fri</div>
      <div class="pill">West Side · Wknd</div>
    </div>
  </div>
  <div class="brand">Hawaii Card Shows</div>
</body>
</html>
