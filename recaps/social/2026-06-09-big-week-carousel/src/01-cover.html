<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Slide 1 — Cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Phudu:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body {
    background: #1a1a1a;
    color: #ffffff;
    font-family: 'Archivo', sans-serif;
    position: relative;
    padding: 100px 90px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  body::before {
    content: '';
    position: absolute;
    top: -300px; right: -200px;
    width: 820px; height: 820px;
    background: radial-gradient(circle, rgba(212,88,42,0.30), transparent 70%);
    pointer-events: none;
  }
  body::after {
    content: '';
    position: absolute;
    bottom: -220px; left: -220px;
    width: 760px; height: 760px;
    background: radial-gradient(circle, rgba(26,107,90,0.22), transparent 70%);
    pointer-events: none;
  }
  .inner { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; justify-content: space-between; }
  .eyebrow {
    font-family: 'Archivo', sans-serif;
    font-weight: 800;
    font-size: 26px;
    letter-spacing: 6px;
    color: #d4582a;
    text-transform: uppercase;
    margin-bottom: 36px;
  }
  h1 {
    font-family: 'Phudu', sans-serif;
    font-weight: 800;
    font-size: 132px;
    line-height: 0.94;
    letter-spacing: -4px;
    margin-bottom: 36px;
  }
  h1 em { font-style: normal; color: #d4582a; }
  .sub {
    font-family: 'Archivo', sans-serif;
    font-weight: 600;
    font-size: 34px;
    line-height: 1.4;
    color: rgba(255,255,255,0.68);
    max-width: 820px;
    margin-top: 40px;
  }
  .sub strong { color: #ffffff; font-weight: 800; }
  .pill-row { display: flex; gap: 16px; margin-top: 48px; flex-wrap: wrap; }
  .pill {
    font-family: 'Archivo', sans-serif;
    font-weight: 700;
    font-size: 26px;
    letter-spacing: 0.5px;
    padding: 14px 26px;
    border-radius: 999px;
    border: 2px solid rgba(255,255,255,0.22);
    color: rgba(255,255,255,0.9);
  }
  .footer-row { display: flex; justify-content: space-between; align-items: flex-end; margin-top: auto; }
  .brand {
    font-family: 'Phudu', sans-serif;
    font-weight: 700; font-size: 24px; letter-spacing: 1.5px;
    color: rgba(255,255,255,0.75); text-transform: uppercase;
  }
  .swipe {
    font-family: 'Archivo', sans-serif;
    font-weight: 700; font-size: 24px; letter-spacing: 1.5px;
    color: rgba(255,255,255,0.55); text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="inner">
    <div>
      <div class="eyebrow">The Week in Review</div>
      <h1>Hawaii just had one of its<br><em>biggest weeks</em><br>of card shows.</h1>
      <p class="sub">Three shows in one week &mdash; capped by the vending debut of UFC champ <strong>Max Holloway</strong>.</p>
    </div>
    <div class="footer-row">
      <div class="brand">Hawaii Card Shows</div>
      <div class="swipe">Swipe →</div>
    </div>
  </div>
</body>
</html>
