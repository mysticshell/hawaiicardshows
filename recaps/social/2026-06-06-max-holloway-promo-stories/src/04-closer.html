<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Story 4 — Closer / Link Sticker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Phudu:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    background: #f5f0e8;
    color: #1a1a1a;
    font-family: 'Archivo', sans-serif;
    position: relative;
    padding: 320px 90px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  body::before {
    content: '';
    position: absolute;
    top: -200px; right: -250px;
    width: 900px; height: 900px;
    background: radial-gradient(circle, rgba(212,88,42,0.28), transparent 70%);
    pointer-events: none;
  }
  body::after {
    content: '';
    position: absolute;
    bottom: -200px; left: -250px;
    width: 900px; height: 900px;
    background: radial-gradient(circle, rgba(26,107,90,0.22), transparent 70%);
    pointer-events: none;
  }
  .inner { position: relative; z-index: 1; }
  .eyebrow {
    font-family: 'Archivo', sans-serif;
    font-weight: 800;
    font-size: 30px;
    letter-spacing: 6px;
    color: #1a6b5a;
    text-transform: uppercase;
    margin-bottom: 40px;
  }
  h1 {
    font-family: 'Phudu', sans-serif;
    font-weight: 800;
    font-size: 156px;
    line-height: 0.96;
    letter-spacing: -4px;
    color: #1a1a1a;
    margin-bottom: 56px;
  }
  h1 em {
    font-style: normal;
    color: #d4582a;
  }
  .lead {
    font-family: 'Archivo', sans-serif;
    font-weight: 500;
    font-size: 36px;
    line-height: 1.5;
    color: #2c2c2c;
    margin-bottom: 64px;
  }
  .lead strong { font-weight: 700; color: #1a1a1a; }
  .lead .hooo { color: #d4582a; font-weight: 800; font-family: 'Phudu', sans-serif; }
  .cta {
    background: #1a1a1a;
    color: #ffffff;
    padding: 48px 56px;
    border-radius: 28px;
  }
  .cta-eyebrow {
    font-family: 'Archivo', sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.6);
    margin-bottom: 14px;
  }
  .cta-headline {
    font-family: 'Phudu', sans-serif;
    font-weight: 800;
    font-size: 56px;
    line-height: 1.1;
    color: #ffffff;
    margin-bottom: 22px;
  }
  .cta-url {
    font-family: 'Archivo', sans-serif;
    font-weight: 700;
    font-size: 32px;
    color: #d4582a;
  }
  .cta-handle {
    font-family: 'Archivo', sans-serif;
    font-weight: 500;
    font-size: 24px;
    color: rgba(255,255,255,0.6);
    margin-top: 6px;
  }
  .brand {
    position: absolute;
    bottom: 320px;
    left: 90px;
    font-family: 'Phudu', sans-serif;
    font-weight: 700;
    font-size: 28px;
    letter-spacing: 2px;
    color: #1a6b5a;
    text-transform: uppercase;
    z-index: 2;
  }
</style>
</head>
<body>
  <div class="inner">
    <div class="eyebrow">This Weekend in Hawaii Cards</div>
    <h1>Three days.<br>Two shows.<br>One <em>champion's</em><br>debut.</h1>
    <p class="lead">The Hawaii hobby has never had a weekend like this. <strong>Show up. Support the organizers.</strong> <span class="hooo">HOOO! 🤙</span></p>
    <div class="cta">
      <div class="cta-eyebrow">Full Calendar</div>
      <div class="cta-headline">Every Hawaii<br>card show, in<br>one place.</div>
      <div class="cta-url">hawaiicardshows.com</div>
      <div class="cta-handle">@hawaiicardshows</div>
    </div>
  </div>
</body>
</html>
